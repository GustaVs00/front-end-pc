<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Paciente - VidaPlena Saúde</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="caixa-formulario">
        <h1>Cadastro de Paciente</h1>
        <!-- O ID 'formCadastro' é o ponto de conexão crucial para que o script JavaScript consiga interceptar o evento de envio (submit) -->
        <form id="formCadastro">
            <div class="grupo-campo">
                <label for="nome">Nome Completo:</label>
                <input type="text" id="nome" name="nome" placeholder="Digite seu nome completo" required>
            </div>
            
            <div class="grupo-campo">
                <label for="email">E-mail:</label>
                <input type="email" id="email" name="email" placeholder="exemplo@email.com" required>
            </div>
            
            <div class="grupo-campo">
                <label for="telefone">Telefone:</label>
                <input type="tel" id="telefone" name="telefone" placeholder="(00) 00000-0000">
            </div>
            
            <button type="submit">Cadastrar</button>
        </form>
        <!-- Esta div é renderizada vazia inicialmente e servirá como um contêiner alvo para a injeção dinâmica de mensagens via JavaScript -->
        <div id="mensagemConfirmacao"></div>
    </div>
    <script src="script.js"></script>
</body>
</html>
