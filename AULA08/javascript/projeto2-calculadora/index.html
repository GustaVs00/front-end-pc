<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projeto 2 — Controle de Estoque</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Substituição de div por main -->
    <main class="container">
        <h1>Gestão de Lotes</h1>
        
        <!-- Uso de aria-label para acessibilidade sem quebrar o layout visual -->
        <input type="number" id="num1" placeholder="Lotes no galpão" aria-label="Quantidade de lotes no galpão">
        
        <select id="operacao" aria-label="Selecione a operação logística">
            <option value="+">+ Receber nova carga (Somar)</option>
            <option value="-">− Despachar mercadoria (Subtrair)</option>
            <option value="*">× Multiplicar por pallets</option>
            <option value="/">÷ Dividir entre caminhões</option>
        </select>
        
        <input type="number" id="num2" placeholder="Quantidade a movimentar" aria-label="Quantidade a movimentar">
        <button id="btn-calcular">Atualizar Estoque</button>
        
        <!-- Tag semântica <output> própria para exibir resultados de cálculos -->
        <output id="resultado">Saldo aparecerá aqui</output>
    </main>
    <script src="script.js"></script>
</body>
</html>
