<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projeto 1 — Check-in de Voo</title>
    <!-- Importação do estilo visual -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Contêiner principal substituído por tag semântica -->
    <main class="container">
        <h1>Embarque Fast</h1>
        <p>Insira o nome do passageiro para confirmar:</p>
        
        <!-- Campo de entrada de dados -->
        <input type="text" id="campo-nome" placeholder="Nome do passageiro...">
        <button id="btn-saudar">Confirmar Check-in</button>
        
        <!-- Local onde a mensagem será injetada via JS -->
        <p id="resultado"></p>
    </main>
    
    <!-- Importação da lógica de funcionamento -->
    <script src="script.js"></script>
</body>
</html>
