<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projeto 4 — Identificação Militar</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Utilização da tag main para definir o conteúdo principal -->
    <main class="container">
        <h1>Alistamento Militar</h1>
        <form id="formulario">
            <div class="campo">
                <label for="nome">Nome de Guerra / Completo:</label>
                <input type="text" id="nome" placeholder="Ex: João da Silva">
                <div class="mensagem" id="msg-nome"></div>
            </div>
            <div class="campo">
                <label for="posto">Posto / Graduação:</label>
                <input type="text" id="posto" placeholder="Ex: Soldado (Sd), Sargento (Sgt)">
                <div class="mensagem" id="msg-posto"></div>
            </div>
            <div class="campo">
                <label for="unidade">Unidade / Pelotão:</label>
                <input type="text" id="unidade" placeholder="Ex: 3º Pelotão de Infantaria / Batalhão de Operações">
                <div class="mensagem" id="msg-unidade"></div>
            </div>
            <button type="submit">Apresentar para o Serviço 🪖</button>
        </form>
        
        <!-- Tag output para o retorno de dados do formulário -->
        <output id="resultado-final"></output>
    </main>
    <script src="script.js"></script>
</body>
</html>
