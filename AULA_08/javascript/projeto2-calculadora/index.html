<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projeto 2 — Controle de Estoque</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Gestão de Lotes</h1>
        <input type="number" id="num1" placeholder="Lotes no galpão">
        <select id="operacao">
            <option value="+">+ Receber nova carga (Somar)</option>
            <option value="-">− Despachar mercadoria (Subtrair)</option>
            <option value="*">× Multiplicar por pallets</option>
            <option value="/">÷ Dividir entre caminhões</option>
        </select>
        <input type="number" id="num2" placeholder="Quantidade a movimentar">
        <button id="btn-calcular">Atualizar Estoque</button>
        <div id="resultado">Saldo aparecerá aqui</div>
    </div>
    <script src="script.js"></script>
</body>
</html>
