<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projeto 3 — Controle de Catraca</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Container principal com tag semântica -->
    <main class="container">
        <h1>Público Atual</h1>
        
        <!-- Output utilizado para resultados e aria-live para acessibilidade -->
        <output id="numero" aria-live="polite">0</output>
        
        <!-- Section agrupando os botões de controle -->
        <section class="botoes" aria-label="Controles da catraca">
            <button class="btn-menos" id="btn-menos">Saiu 🚶</button>
            <button class="btn-reset" id="btn-reset">Esvaziar</button>
            <button class="btn-mais"  id="btn-mais">Entrou 🚶</button>
        </section>
    </main>
    <script src="script.js"></script>
</body>
</html>
