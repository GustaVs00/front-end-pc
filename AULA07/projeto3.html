<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projeto 3 — Galeria de Peças</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: #1a1a2e;    /* fundo escuro para contraste */
            color: white;
            padding: 2rem;
        }

        /* ══════════════════════════════════
           TÍTULO DA PÁGINA
           ══════════════════════════════════ */
        h1 {
            text-align: center;
            font-size: 2rem;
            margin-bottom: 0.5rem;
        }

        .subtitulo {
            text-align: center;
            color: rgba(255, 255, 255, 0.6);
            margin-bottom: 2rem;
            font-size: 0.95rem;
        }

        /* ══════════════════════════════════
           GALERIA
           ══════════════════════════════════ */
        .galeria {
            display: flex;
            flex-wrap: wrap;           /* permite quebra de linha */
            gap: 12px;                 /* espaço entre as imagens */
            max-width: 1000px;
            margin: 0 auto;            /* centraliza o container */
        }

        /* ══════════════════════════════════
           ITEM DA GALERIA (Agora usando <figure>)
           ══════════════════════════════════ */
        .galeria-item {
            flex: 1 1 250px;
            height: 250px;
            border-radius: 12px;
            overflow: hidden;
            position: relative;        /* para posicionar o overlay */
            cursor: pointer;
            outline: none;             /* Remove a borda padrão de foco */
        }

        /* Adiciona uma borda bonita quando navegado pelo teclado (Acessibilidade) */
        .galeria-item:focus-visible {
            outline: 3px solid #4da6ff;
            outline-offset: 2px;
        }

        /* ══════════════════════════════════
           IMAGEM
           ══════════════════════════════════ */
        .galeria-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;         /* preenche sem distorcer */
            display: block;
            transition: transform 0.4s ease, opacity 0.4s ease;
        }

        /* HOVER e FOCUS (Mouse e Teclado) */
        .galeria-item:hover img,
        .galeria-item:focus img {
            transform: scale(1.08);    /* aumenta 8% */
            opacity: 0.85;             /* leve escurecimento */
        }

        /* ══════════════════════════════════
           OVERLAY (Agora usando <figcaption>)
           ══════════════════════════════════ */
        .overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 1rem;
            background: linear-gradient(transparent, rgba(0, 0, 0, 0.8));
            color: white;

            /* Começa invisível */
            opacity: 0;
            transform: translateY(10px);
            transition: opacity 0.4s ease, transform 0.4s ease;
        }

        /* Revela o overlay no hover ou no foco do teclado */
        .galeria-item:hover .overlay,
        .galeria-item:focus .overlay {
            opacity: 1;
            transform: translateY(0);
        }

        .overlay h3 {
            font-size: 1rem;
            margin-bottom: 0.2rem;
        }

        .overlay p {
            font-size: 0.8rem;
            opacity: 0.8;
        }

        /* ══════════════════════════════════
           RESPONSIVO
           ══════════════════════════════════ */
        @media (max-width: 600px) {
            .galeria-item {
                flex: 1 1 100%;        /* uma imagem por linha */
                height: 200px;
            }
        }
    </style>
</head>
<body>

    <h1>Galeria de Peças Computacionais</h1>
    <p class="subtitulo">Passe o mouse ou use a tecla Tab para ver os detalhes dos componentes</p>

    <div class="galeria">

        <!-- Item 1 -->
        <figure class="galeria-item" tabindex="0">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcT8FYsHRSNaqz2U0SY88H8m09LZVOhvkQyqmxW_7ju9Ng&s=10" alt="Fotografia de um Processador de computador">
            <figcaption class="overlay">
                <h3>Processador (CPU)</h3>
                <p>O cérebro do computador</p>
            </figcaption>
        </figure>

        <!-- Item 2 -->
        <figure class="galeria-item" tabindex="0">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRobH4LxllfXEuIiVXkLnFoWQdwpqaYCRQjwQGpwM81BQ&s=10" alt="Fotografia de uma Placa Mãe">
            <figcaption class="overlay">
                <h3>Placa Mãe</h3>
                <p>Conecta todos os componentes</p>
            </figcaption>
        </figure>

        <!-- Item 3 -->
        <figure class="galeria-item" tabindex="0">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQdE_L9QR7ur9ggtGbm2SaSGgenoN-ruLQfSsSNfT69Pg&s=10" alt="Fotografia de um pente de Memória RAM">
            <figcaption class="overlay">
                <h3>Memória RAM</h3>
                <p>Acesso rápido a dados ativos</p>
            </figcaption>
        </figure>

        <!-- Item 4 -->
        <figure class="galeria-item" tabindex="0">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSqJOr3eZ4kvDvpXxA1I-vHeqWaoXOeTEjfPr-182lEnQ&s=10" alt="Fotografia de uma Placa de Vídeo">
            <figcaption class="overlay">
                <h3>Placa de Vídeo (GPU)</h3>
                <p>Renderização gráfica extrema</p>
            </figcaption>
        </figure>

        <!-- Item 5 -->
        <figure class="galeria-item" tabindex="0">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSjRMQNCDD6W_gz8-StPXrV2-LW3U2_Ugl1AB1VbTktuQ&s=10" alt="Fotografia de um SSD de armazenamento">
            <figcaption class="overlay">
                <h3>Armazenamento SSD</h3>
                <p>Velocidade máxima no boot</p>
            </figcaption>
        </figure>

        <!-- Item 6 -->
        <figure class="galeria-item" tabindex="0">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRF2U12u3LrK5i4EyDyLVzhe1lK5aIN23lPf8GZ-iAwDw&s=10" alt="Fotografia de uma Fonte de Alimentação">
            <figcaption class="overlay">
                <h3>Fonte de Alimentação</h3>
                <p>Fornece energia com segurança</p>
            </figcaption>
        </figure>

    </div>

</body>
</html>
