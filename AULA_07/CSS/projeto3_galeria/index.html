<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projeto 3 — Galeria de Peças</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Galeria de Peças Computacionais</h1>
    <p class="subtitulo">Passe o mouse ou use a tecla Tab para ver os detalhes dos componentes</p>

    <div class="galeria">

        <!-- Item 1 -->
        <!-- O atributo 'tabindex="0"' adiciona o elemento à ordem de navegação natural do teclado (tecla Tab), garantindo acessibilidade para usuários que não usam mouse[cite: 15] -->
        <figure class="galeria-item" tabindex="0">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcT8FYsHRSNaqz2U0SY88H8m09LZVOhvkQyqmxW_7ju9Ng&s=10" alt="Fotografia de um Processador de computador">
            <!-- A tag <figcaption> combinada com CSS substitui o uso de divs genéricas para legendas, aprimorando a semântica do HTML[cite: 15] -->
            <figcaption class="overlay">
                <h3>Processador (CPU)</h3>
                <p>O cérebro do computador</p>
            </figcaption>
        </figure>

        <!-- Item 2 -->
        <figure class="galeria-item" tabindex="0">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRobH4LxllfXEuIiVXkLnFoWQdwpqaYCRQjwQGpwM81BQ&s=10" alt="Fotografia de uma Placa Mãe">
            <figcaption class="overlay">
                <h3>Placa Mãe</h3>
                <p>Conecta todos os componentes</p>
            </figcaption>
        </figure>

        <!-- Item 3 -->
        <figure class="galeria-item" tabindex="0">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQdE_L9QR7ur9ggtGbm2SaSGgenoN-ruLQfSsSNfT69Pg&s=10" alt="Fotografia de um pente de Memória RAM">
            <figcaption class="overlay">
                <h3>Memória RAM</h3>
                <p>Acesso rápido a dados ativos</p>
            </figcaption>
        </figure>

        <!-- Item 4 -->
        <figure class="galeria-item" tabindex="0">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSqJOr3eZ4kvDvpXxA1I-vHeqWaoXOeTEjfPr-182lEnQ&s=10" alt="Fotografia de uma Placa de Vídeo">
            <figcaption class="overlay">
                <h3>Placa de Vídeo (GPU)</h3>
                <p>Renderização gráfica extrema</p>
            </figcaption>
        </figure>

        <!-- Item 5 -->
        <figure class="galeria-item" tabindex="0">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSjRMQNCDD6W_gz8-StPXrV2-LW3U2_Ugl1AB1VbTktuQ&s=10" alt="Fotografia de um SSD de armazenamento">
            <figcaption class="overlay">
                <h3>Armazenamento SSD</h3>
                <p>Velocidade máxima no boot</p>
            </figcaption>
        </figure>

        <!-- Item 6 -->
        <figure class="galeria-item" tabindex="0">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRF2U12u3LrK5i4EyDyLVzhe1lK5aIN23lPf8GZ-iAwDw&s=10" alt="Fotografia de uma Fonte de Alimentação">
            <figcaption class="overlay">
                <h3>Fonte de Alimentação</h3>
                <p>Fornece energia com segurança</p>
            </figcaption>
        </figure>

    </div>

</body>
</html>
